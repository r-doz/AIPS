years:
- 2024
- 2025
parquet_path: data/processed/cpr_gfw_salinity.parquet
gulf_csv_path: data/raw/ts_gulf_coords.csv
train_fraction: 0.9
data_seed: 8
split_strategy: fixed_test_window
covariate_cols:
- chl
- thetao
- fishing_block
- is_holiday
- is_weekend
- cell_lag_1
- cell_lag_7
- salinity
M_inducing: 300
np_seed: 8
model:
  spatial_kernels:
  - type: rbf
    hyperparameters:
      lengthscale: 0.2
      variance: 1.0e-10
    trainable:
      lengthscale: false
      variance: false
  - type: rbf
    hyperparameters:
      lengthscale: 0.01
      variance: 1.0e-10
    trainable:
      lengthscale: false
      variance: false
  temporal_kernels:
  - type: rbf
    hyperparameters:
      lengthscale: 0.01
      variance: 1.0e-10
    trainable:
      lengthscale: false
      variance: false
  - type: periodic
    hyperparameters:
      lengthscale: 0.8
      period_days: 14.0
      variance: 1.0e-10
    trainable:
      lengthscale: false
      period: true
      variance: false
  spatial_composition: sum
  temporal_composition: sum
lr: 0.001
num_steps: 5000
minibatch: 1024
num_mc: 32
grad_clip: 10.0
device: cpu
num_pred_samples: 300
num_vis_samples: 500
report_root: /u/rominadoz/projects/AIPS/reports/seeded_monthly_windows_ablation/no_kernel/seed_8/runs
model_family: 2025_may_15_21
run_name: 2025_may_15_21
log_every: 100
lag_features:
  enabled: true
  cell_cols:
  - longitude
  - latitude
  cell_lags:
  - 1
  - 7
  cell_rolling_windows:
  - 7
  daily_total_lags:
  - 1
  - 7
  daily_total_rolling_windows:
  - 7
  date_col: date
  fillna_value: 0.0
  mode: observed_past
  target_col: ais_vessels_count
zero_gate:
  enabled: true
  mode: confidence_redistribute
  hidden_layer_sizes:
  - 32
  activation: relu
  alpha: 0.0001
  max_iter: 500
  threshold: 0.3
  redistribution_gamma: 1.0
  redistribution_scale: 1.0
global_cell_mean_mode: expanding
global_cell_mean_run_name: dataseed42_npseed0
global_mean_run_name: dataseed42_npseed0
kernel_noise:
  trainable: false
  value: 0.001
last_available_mode: one_step_ahead
last_available_run_name: dataseed42_npseed0_onestep
test_end_date: '2025-05-21'
test_start_date: '2025-05-15'
kernel_config:
  spatial:
  - type: rbf
    hyperparameters:
      lengthscale: 0.2
      variance: 1.0e-10
    trainable:
      lengthscale: false
      variance: false
  - type: rbf
    hyperparameters:
      lengthscale: 0.01
      variance: 1.0e-10
    trainable:
      lengthscale: false
      variance: false
  temporal:
  - type: rbf
    hyperparameters:
      lengthscale: 0.01
      variance: 1.0e-10
    trainable:
      lengthscale: false
      variance: false
  - type: periodic
    hyperparameters:
      lengthscale: 0.8
      variance: 1.0e-10
      period: 0.09699503929048238
    trainable:
      lengthscale: false
      period: true
      variance: false
  spatial_composition: sum
  temporal_composition: sum
