years: 2024
parquet_path: data/processed/cpr_gfw_2024.parquet
gulf_csv_path: data/raw/ts_gulf_coords.csv
train_fraction: 0.9
data_seed: 42
split_strategy: chronological
covariate_cols:
- chl
- thetao
- is_holiday
- is_weekend
- fishing_block
M_inducing: 300
np_seed: 0
model:
  spatial_kernels: &id001
  - type: rbf
    hyperparameters:
      lengthscale: 0.5
      variance: 1.0
    trainable:
      lengthscale: true
      variance: true
  temporal_kernels: &id002
  - type: periodic
    hyperparameters:
      lengthscale: 0.3
      period: 1.0
      variance: 0.5
    trainable:
      lengthscale: true
      period: true
      variance: true
lr: 0.0001
num_steps: 5000
minibatch: 1024
num_mc: 7
grad_clip: 10.0
device: cpu
num_pred_samples: 300
num_vis_samples: 500
report_root: reports
model_family: basic_lgcp
run_name: lgcp_M300_steps5000_COVcthwf_chrono
log_every: 100
global_mean_run_name: dataseed42_npseed0_chrono
last_available_run_name: dataseed42_npseed0_chrono
kernel_config:
  spatial: *id001
  temporal: *id002
