parquet_path: data/processed/cpr_gfw.parquet
years: 2024
target_col: ais_vessels_count
date_col: date
cell_cols:
- longitude
- latitude
train_fraction: 0.9
data_seed: 42
split_strategy: fixed_test_window
test_start_date: '2024-12-01'
test_end_date: '2024-12-10'
cell_mean_mode: expanding
fallback: global_train_mean
report_root: reports
model_family: multi-kernel_lgcp
run_name: dataseed42_npseed0_dec01_dec10_expanding
eps: 1.0e-08
gulf_csv_path: data/raw/ts_gulf_coords.csv
covariate_cols:
- chl
- thetao
- fishing_block
- is_holiday
- is_weekend
last_available_mode: frozen_train
global_cell_mean_mode: expanding
last_available_run_name: dataseed42_npseed0_frozen_dec01_dec10
global_mean_run_name: dataseed42_npseed0_dec01_dec10
global_cell_mean_run_name: dataseed42_npseed0_dec01_dec10_expanding
num_steps: 5000
M_inducing: 300
np_seed: 0
model:
  spatial_kernels:
  - type: RBF
    hyperparameters:
      lengthscale: 0.5
      variance: 1.0
    trainable:
      lengthscale: true
      variance: true
  temporal_kernels:
  - type: RBF
    hyperparameters:
      lengthscale: 0.1
      variance: 0.2
    trainable:
      lengthscale: false
      variance: true
kernel_noise:
  value: 0.001
  trainable: false
lr: 0.0005
minibatch: 1024
num_mc: 7
grad_clip: 10.0
device: cpu
num_pred_samples: 300
num_vis_samples: 500
log_every: 100
