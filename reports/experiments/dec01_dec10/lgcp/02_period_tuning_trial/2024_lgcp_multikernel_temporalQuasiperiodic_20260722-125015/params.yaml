years: 2024
parquet_path: data/processed/cpr_gfw_2024.parquet
gulf_csv_path: data/raw/ts_gulf_coords.csv
train_fraction: 0.9
data_seed: 42
split_strategy: fixed_test_window
covariate_cols:
- chl
- thetao
- fishing_block
- is_holiday
- is_weekend
M_inducing: 300
np_seed: 0
model:
  spatial_kernels: &id001
  - type: rbf
    hyperparameters:
      lengthscale: 0.5
      variance: 1.0
    trainable:
      lengthscale: true
      variance: true
  temporal_kernels: &id002
  - type: rbf
    hyperparameters:
      lengthscale: 0.1
      variance: 0.2
    trainable:
      lengthscale: false
      variance: true
  - type: quasi_periodic
    hyperparameters:
      envelope_lengthscale: 0.2
      period: 0.074
      periodic_lengthscale: 0.5
      variance: 0.05
    trainable:
      envelope_lengthscale: false
      period: false
      periodic_lengthscale: true
      variance: true
  spatial_composition: sum
  temporal_composition: sum
lr: 0.0001
num_steps: 5000
minibatch: 1024
num_mc: 7
grad_clip: 10.0
device: cpu
num_pred_samples: 300
num_vis_samples: 500
report_root: reports/experiments
model_family: new_tests
run_name: lgcp_multikernel
log_every: 100
lag_features:
  enabled: false
  mode: observed_past
  target_col: ais_vessels_count
  date_col: date
  cell_cols:
  - longitude
  - latitude
  cell_lags:
  - 1
  - 7
  cell_rolling_windows:
  - 7
  daily_total_lags:
  - 1
  - 7
  daily_total_rolling_windows:
  - 7
  fillna_value: 0.0
test_start_date: '2024-12-01'
test_end_date: '2024-12-10'
last_available_mode: one_step_ahead
global_cell_mean_mode: expanding
last_available_run_name: dataseed42_npseed0_onestep
global_mean_run_name: dataseed42_npseed0
global_cell_mean_run_name: dataseed42_npseed0
kernel_noise:
  value: 0.001
  trainable: false
kernel_config:
  spatial: *id001
  temporal: *id002
  spatial_composition: sum
  temporal_composition: sum
