years:
- 2024
- 2025
parquet_path: data/processed/cpr_gfw.parquet
gulf_csv_path: data/raw/ts_gulf_coords.csv
train_fraction: 0.9
data_seed: 42
split_strategy: fixed_test_window
covariate_cols:
- chl
- thetao
- fishing_block
- is_holiday
- is_weekend
- cell_lag_1
- cell_lag_7
M_inducing: 300
np_seed: 0
model:
  spatial_kernels: &id001
  - type: rbf
    hyperparameters:
      lengthscale: 0.35
      variance: 2.0
    trainable:
      lengthscale: false
      variance: true
  temporal_kernels: &id002
  - type: rbf
    hyperparameters:
      lengthscale: 0.08
      variance: 0.5
    trainable:
      lengthscale: false
      variance: true
  - type: periodic
    hyperparameters:
      lengthscale: 0.5
      period: 0.074
      variance: 0.2
    trainable:
      lengthscale: true
      period: false
      variance: true
  spatial_composition: sum
  temporal_composition: sum
lr: 0.001
num_steps: 5000
minibatch: 1024
num_mc: 32
grad_clip: 10.0
device: cpu
num_pred_samples: 300
num_vis_samples: 500
report_root: reports/experiments
model_family: new_tests
run_name: lgcp_multikernel_periodic
log_every: 100
lag_features:
  enabled: true
  mode: observed_past
  target_col: ais_vessels_count
  date_col: date
  cell_cols:
  - longitude
  - latitude
  cell_lags:
  - 1
  - 7
  cell_rolling_windows:
  - 7
  daily_total_lags:
  - 1
  - 7
  daily_total_rolling_windows:
  - 7
  fillna_value: 0.0
zero_gate:
  enabled: false
  hidden_layer_sizes:
  - 32
  activation: relu
  alpha: 0.0001
  max_iter: 500
  threshold: 0.5
test_start_date: '2025-11-01'
test_end_date: '2025-11-07'
last_available_mode: one_step_ahead
global_cell_mean_mode: expanding
last_available_run_name: dataseed42_npseed0_onestep
global_mean_run_name: dataseed42_npseed0
global_cell_mean_run_name: dataseed42_npseed0
kernel_noise:
  value: 0.001
  trainable: false
kernel_config:
  spatial: *id001
  temporal: *id002
  spatial_composition: sum
  temporal_composition: sum
