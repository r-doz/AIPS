years: 2024
parquet_path: data/processed/cpr_gfw_2024.parquet
gulf_csv_path: data/raw/ts_gulf_coords.csv
train_fraction: 0.9
data_seed: 42
split_strategy: fixed_test_window
covariate_cols:
- chl
- thetao
- fishing_block
- is_holiday
- is_weekend
M_inducing: 300
np_seed: 0
model:
  spatial_kernels: &id001
  - type: rbf
    hyperparameters:
      lengthscale: 0.35
      variance: 1.0
    trainable:
      lengthscale: false
      variance: true
  - type: rational_quadratic
    hyperparameters:
      alpha: 0.8
      lengthscale: 1.2
      variance: 0.35
    trainable:
      alpha: false
      lengthscale: true
      variance: true
  temporal_kernels: &id002
  - type: rbf
    hyperparameters:
      lengthscale: 0.1
      variance: 0.2
    trainable:
      lengthscale: false
      variance: true
lr: 0.0005
num_steps: 5000
minibatch: 1024
num_mc: 7
grad_clip: 10.0
device: cpu
num_pred_samples: 300
num_vis_samples: 500
report_root: reports
model_family: multi-kernel_lgcp
run_name: lgcp_multikernel_nov21_nov30_rbfL035Fixed
log_every: 100
test_start_date: '2024-11-21'
test_end_date: '2024-11-30'
last_available_mode: frozen_train
last_available_run_name: dataseed42_npseed0_frozen_nov21_nov30
global_mean_run_name: dataseed42_npseed0_nov21_nov30
kernel_noise:
  value: 0.001
  trainable: false
kernel_config:
  spatial: *id001
  temporal: *id002
