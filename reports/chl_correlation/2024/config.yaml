years: 2024
parquet_path: data/processed/cpr_gfw_2024.parquet
date_col: date
target_col: ais_vessels_count
chl_col: chl
thetao_col: thetao
report_root: reports
run_name: lgcp_nov21_nov30
max_lag: 30
rolling_window: 7
gulf_csv_path: data/raw/ts_gulf_coords.csv
covariate_cols:
- chl
- thetao
- fishing_block
- is_holiday
- is_weekend
- cell_lag_1
split_strategy: fixed_test_window
test_start_date: '2024-11-21'
test_end_date: '2024-11-30'
train_fraction: 0.9
data_seed: 42
model_family: lagged_lgcp
last_available_mode: one_step_ahead
global_cell_mean_mode: expanding
last_available_run_name: dataseed42_npseed0_onestep_nov21_nov30
global_mean_run_name: dataseed42_npseed0_nov21_nov30
global_cell_mean_run_name: dataseed42_npseed0_nov21_nov30_expanding
num_steps: 5000
M_inducing: 300
np_seed: 0
model:
  spatial_kernels:
  - type: RBF
    hyperparameters:
      lengthscale: 0.5
      variance: 1.0
    trainable:
      lengthscale: true
      variance: true
  temporal_kernels:
  - type: RBF
    hyperparameters:
      lengthscale: 0.1
      variance: 0.2
    trainable:
      lengthscale: false
      variance: true
kernel_noise:
  value: 0.001
  trainable: false
lag_features:
  enabled: true
  mode: observed_past
  target_col: ais_vessels_count
  date_col: date
  cell_cols:
  - longitude
  - latitude
  cell_lags:
  - 1
  - 7
  cell_rolling_windows:
  - 7
  daily_total_lags:
  - 1
  - 7
  daily_total_rolling_windows:
  - 7
  fillna_value: 0.0
lr: 0.0005
minibatch: 1024
num_mc: 7
grad_clip: 10.0
device: cpu
num_pred_samples: 300
num_vis_samples: 500
log_every: 100
