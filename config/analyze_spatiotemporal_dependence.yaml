# config/analyze_spatiotemporal_dependence.yaml

parquet_path: data/processed/cpr_gfw_2024.parquet

report_root: reports/spatiotemporal_diagnostics
run_name: 2024_full_year

target_col: ais_vessels_count
date_col: date
lon_col: longitude
lat_col: latitude

# We use the full year for exploratory data analysis.
# This is not a test-set evaluation.
use_full_dataset: true

# Transformations to analyze
transforms:
  - y
  - log1p_y

# Temporal autocorrelation lags, in days
temporal_lags:
  - 1
  - 2
  - 3
  - 5
  - 7
  - 10
  - 14
  - 21
  - 30

# Spatial variogram settings
spatial:
  n_distance_bins: 12
  max_pairs_per_day: 5000
  random_seed: 42

# Spatio-temporal variogram settings
spatiotemporal:
  temporal_lags:
    - 1
    - 3
    - 7
    - 10
    - 14
    - 21
    - 30
  n_distance_bins: 12
  max_pairs_per_lag: 50000
  random_seed: 42

save_csv: true
save_plots: true