# config/15_gnn.yaml

# --- data ---
years: [2024,2025]
parquet_path: data/processed/cpr_gfw.parquet
gulf_csv_path: data/raw/ts_gulf_coords.csv
target_col: ais_vessels_count

# --- split ---
# Options:
#   random_day         -> random split by whole days (NOT compatible with lag_features)
#   chronological      -> train first part of the year, test final part
#   fixed_test_window  -> train before test_start_date, test selected window
split_strategy: fixed_test_window
train_fraction: 0.9
data_seed: 42

test_start_date: "2025-05-05"
test_end_date: "2025-05-11"

# --- features ---
covariate_cols:
  - chl
  - thetao
  - fishing_block
  - is_holiday
  - is_weekend
  - cell_lag_1
  - cell_lag_7

  #- cell_roll_mean_7
  #- daily_total_lag_1
  #- daily_total_lag_7
  #- daily_total_roll_mean_7

include_coords: true
include_time: true
standardize_features: true

lag_features:
  enabled: true
  mode: observed_past
  target_col: ais_vessels_count
  date_col: date
  cell_cols:
    - longitude
    - latitude
  cell_lags: [1, 7]
  cell_rolling_windows: [7]
  daily_total_lags: [1, 7]
  daily_total_rolling_windows: [7]
  fillna_value: 0.0

# --- graph ---
adjacency: queen  # "rook" or "queen"

# --- model ---
hidden_dim: 64  # notebook 51 grid search: best of [16, 32, 64]
num_layers: 3   # notebook 51 grid search: best of [1, 2, 3]
dropout: 0.10

# --- training ---
# Choose: cell_poisson (original), combined, or daily_only.
# combined = cell Poisson / max(training mean cell count, 1)
#          + daily_weight * daily MAE / max(training mean daily total, 1).
# daily_only uses only normalized daily MAE; its cell allocations are not supervised.
loss:
  mode: daily_mse # cell_poisson or daily_mse
  daily_weight: 1.0 # Used only by combined; tune on validation windows.

lr: 0.01  # notebook 51 grid search: best of [1e-4, 1e-3, 1e-2, 1e-1]
weight_decay: 1.0e-5
num_epochs: 300 # 500
torch_seed: 0
device: cpu
log_every: 25

# --- output ---
report_root: reports/experiments/final_experiments
model_family: new_tests
run_name: may_5_11_gnn

# Display only: same rendering as LGCP, for every forecast day.
spatial_plot:
  radius_cells: 1
  diffusion_strength: 0.25
  display_method: pchip
  nx: 2700
  ny: 1800
