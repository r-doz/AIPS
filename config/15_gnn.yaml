# config/15_gnn.yaml

# --- data ---
years: 2024
parquet_path: data/processed/cpr_gfw.parquet
target_col: ais_vessels_count

# --- split ---
# Options:
#   random_day         -> random split by whole days (NOT compatible with lag_features)
#   chronological      -> train first part of the year, test final part
#   fixed_test_window  -> train before test_start_date, test selected window
split_strategy: fixed_test_window
train_fraction: 0.9
data_seed: 42

test_start_date: "2024-04-21"
test_end_date: "2024-04-30"

# --- features ---
covariate_cols:
  - chl
  - thetao
  - fishing_block
  - is_holiday
  - is_weekend
  - cell_lag_1
  - cell_lag_7
  - cell_roll_mean_7
  - daily_total_lag_1
  - daily_total_lag_7
  - daily_total_roll_mean_7

include_coords: true
include_time: true
standardize_features: true

lag_features:
  enabled: true
  mode: observed_past
  target_col: ais_vessels_count
  date_col: date
  cell_cols:
    - longitude
    - latitude
  cell_lags: [1, 7]
  cell_rolling_windows: [7]
  daily_total_lags: [1, 7]
  daily_total_rolling_windows: [7]
  fillna_value: 0.0

# --- graph ---
adjacency: queen  # "rook" or "queen"

# --- model ---
hidden_dim: 32 #64
num_layers: 2 # 3
dropout: 0.10

# --- training ---
lr: 0.001
weight_decay: 1.0e-5
num_epochs: 300 # 500
torch_seed: 0
device: cpu
log_every: 25

# --- output ---
report_root: reports/experiments/new_tests
model_family: gnn
run_name: gnn_apr21_apr30
