year: 2024

area:
  minimum_longitude: 13.141159647873394
  maximum_longitude: 13.8238
  minimum_latitude: 45.4698
  maximum_latitude: 45.8078

dates:
  start_month: "01"
  start_day: "01"
  end_month: "12"
  end_day: "31"

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  secrets: secrets

static_files:
  gulf_coords: data/raw/ts_gulf_coords.csv
  marine_bounds: data/raw/italy_marine_bounds.csv

copernicus:
  products:
    - cmems_mod_med_phy-temp_my_4.2km_P1D-m
    - cmems_mod_med_bgc-plankton_my_4.2km_P1D-m
    #- cmems_mod_med_phy-tem_anfc_4.2km_P1D-m
    #- cmems_mod_med_bgc-pft_anfc_4.2km_P1D-m
  min_depth: 0.0
  max_depth: 1.5
  remove_nc_after_conversion: true
  overwrite: true
  overwrite_clean: true

gfw_ais:
  product_name: public-global-fishing-effort:latest
  spatial_resolution: HIGH
  temporal_resolution: DAILY
  group_by: VESSEL_ID
  token_file: secrets/gfw_token.txt
  overwrite: true
  overwrite_clean: true

gfw_sar:
  table: global-fishing-watch.pipe_sentinel2_v1_published.detect_scene_match_pipe_v3
  output_name: s2_vessel_detections
  key_file: secrets/gcp_bigquery_key.json
  overwrite: true
  overwrite_clean: true

processed:
  overwrite: true