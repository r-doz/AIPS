# Daily NB-INGARCH-X. Match dates and covariates to the GNN being compared.
years: [2024, 2025]
parquet_path: data/processed/cpr_gfw.parquet
target_col: ais_vessels_count
split_strategy: fixed_test_window
test_start_date: '2025-11-01'
test_end_date: '2025-11-07'
train_fraction: 0.9
data_seed: 42
forecast_mode: one_step_ahead

# Same features as config/15_gnn.yaml, retained separately for every cell.
# No new calendar features, environmental summaries, or longer lags are added.
covariate_cols:
  - chl
  - thetao
  - fishing_block
  - is_holiday
  - is_weekend
  - cell_lag_1
  - cell_lag_7
  #- cell_roll_mean_7
  #- daily_total_lag_1
  #- daily_total_lag_7
  #- daily_total_roll_mean_7
include_coords: true
include_time: true
lag_features:
  enabled: true
  mode: observed_past
  cell_lags: [1, 7]
  cell_rolling_windows: [7]
  daily_total_lags: [1, 7]
  daily_total_rolling_windows: [7]
  fillna_value: 0.0

model:
  observation_lags: [1, 7] # Must be allowed historical information in the comparison.
  ridge: 0.1 # L2 penalty on standardized covariate coefficients; tune on training windows.
  max_iter: 1000

report_root: reports/experiments
model_family: daily_count
run_name: nov_1_7_nb_ingarch
