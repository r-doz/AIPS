covariate_cols:
- chl
- thetao
- fishing_block
- is_holiday
- is_weekend
- cell_lag_1
- cell_lag_7
data_seed: 42
forecast_mode: one_step_ahead
include_coords: true
include_time: true
lag_features:
  cell_lags:
  - 1
  - 7
  cell_rolling_windows:
  - 7
  daily_total_lags:
  - 1
  - 7
  daily_total_rolling_windows:
  - 7
  enabled: true
  fillna_value: 0.0
  mode: observed_past
model:
  allow_writing_files: false
  depth: 4
  has_time: true
  iterations: 1000
  l2_leaf_reg: 3.0
  learning_rate: 0.05
  loss_function: RMSE
  random_seed: 0
  random_strength: 0.5
  thread_count: 1
  verbose: false
model_family: daily_count
parquet_path: data/processed/cpr_gfw.parquet
report_root: reports/experiments/new_tests
run_name: nov_3_9_catboost_rmse
split_strategy: fixed_test_window
target_col: ais_vessels_count
test_start_date: '2025-11-03'
test_end_date: '2025-11-09'
train_fraction: 0.9
training:
  half_life_days: 90
years:
- 2024
- 2025
