# config/14_window_poisson_glm.yaml

# --- data ---
years: 2024
parquet_path: data/processed/cpr_gfw.parquet
target_col: ais_vessels_count

# --- split ---
# Options:
#   random_day     -> same style as current LGCP split
#   chronological  -> train first part of the year, test final part
split_strategy: chronological
train_fraction: 0.9
data_seed: 42

# --- window features ---
window_size: 1
drop_incomplete_windows: true

covariate_cols:
  - chl
  - thetao
  - is_holiday
  - is_weekend
  - fishing_block

include_coords: true
include_time: true

# --- model ---
poisson_alpha: 0.05
max_iter: 1000
standardize_features: true

# --- output ---
report_root: reports
model_family: window_poisson_glm
run_name: window_poisson_glm_W1_alpha005_chronological