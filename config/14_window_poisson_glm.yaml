# config/14_window_poisson_glm.yaml

# --- data ---
years: 2024
parquet_path: data/processed/cpr_gfw.parquet
target_col: ais_vessels_count

# --- split ---
# Options:
#   random_day         -> random split by whole days
#   chronological      -> train first part of the year, test final part
#   fixed_test_window  -> train before test_start_date, test selected window
split_strategy: fixed_test_window
train_fraction: 0.9
data_seed: 42

test_start_date: "2024-04-21"
test_end_date: "2024-04-30"

# --- window features ---
window_size: 1
drop_incomplete_windows: true

covariate_cols:
  - chl
  - thetao
  - is_holiday
  - is_weekend
  - fishing_block

include_coords: true
include_time: true

# --- model ---
poisson_alpha: 0.05
max_iter: 1000
standardize_features: true

# --- output ---
report_root: reports/experiments
model_family: window_poisson_glm
run_name: window_poisson_glm