# config/14_window_poisson_glm.yaml

# --- data ---
years: [2024,2025]
parquet_path: data/processed/cpr_gfw.parquet
target_col: ais_vessels_count

# --- split ---
# Options:
#   random_day         -> random split by whole days
#   chronological      -> train first part of the year, test final part
#   fixed_test_window  -> train before test_start_date, test selected window
split_strategy: fixed_test_window
train_fraction: 0.9
data_seed: 42

test_start_date: "2025-05-05"
test_end_date: "2025-05-11"

# --- window features ---
window_size: 14  # notebook 51 grid search: best of [1, 3, 7, 14]
drop_incomplete_windows: true

covariate_cols:
  - chl
  - thetao
  - is_holiday
  - is_weekend
  - fishing_block
  - cell_lag_1
  - cell_lag_7

include_coords: true
include_time: true

# --- model ---
poisson_alpha: 0.01  # notebook 51 grid search: best of [1e-4, 1e-3, 1e-2, 1e-1, 1.0]
max_iter: 1000
standardize_features: true

# --- output ---
report_root: reports/experiments/final_experiments
model_family: new_tests
run_name: may_5_11_window_poisson_glm_window_7
