# Config for scripts/12b_global_cell_mean.py.
parquet_path: data/processed/cpr_gfw.parquet
years: [2024, 2025]
target_col: ais_vessels_count
date_col: date
cell_cols: [longitude, latitude]

# Same evaluation window as exp1.yaml.
split_strategy: fixed_test_window
test_start_date: "2025-11-03"
test_end_date: "2025-11-09"

# Update each cell's mean with observations from preceding test days.
cell_mean_mode: expanding # Alternative: frozen_train

report_root: reports/experiments/final_experiments
model_family: global_cell_mean_poisson
run_name: 2024+2025_nov_3_9_expanding
