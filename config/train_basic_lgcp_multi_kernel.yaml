# config/train_basic_lgcp_multi_kernel.yaml
years: 2024

# --- data ---
parquet_path: data/processed/cpr_gfw.parquet
gulf_csv_path: data/raw/ts_gulf_coords.csv

covariate_cols:
  - chl
  - thetao
  - fishing_block
  - is_holiday
  - is_weekend

# --- split ---
split_strategy: fixed_test_window # fixed_test_window OR chronological OR random_day
test_start_date: "2024-12-01"
test_end_date: "2024-12-10"
train_fraction: 0.9
data_seed: 42

# --- model lgcp ---
M_inducing: 300
np_seed: 0
model:
  spatial_kernels:
    - type: RBF
      hyperparameters:
        lengthscale: 0.5
        variance: 1.0
      trainable:
        lengthscale: true
        variance: true
    - type: RationalQuadratic
      hyperparameters:
        lengthscale: 1.2
        variance: 0.35
        alpha: 0.8
      trainable:
        lengthscale: true
        variance: true
        alpha: false
  temporal_kernels:
    #- type: periodic
    #  hyperparameters:
    #    lengthscale: 0.3
    #    variance: 0.55
    #    period: 3.853699
    #  trainable:
    #    lengthscale: true
    #    variance: true
    #    period: false
    - type: RBF
      hyperparameters:
        lengthscale: 0.10 # 0.01
        variance: 0.20 # 0.20
      trainable:
        lengthscale: false
        variance: true
kernel_noise:
  value: 1.0e-3
  trainable: false

# --- dummy models ---
last_available_mode: frozen_train  # frozen_train OR one_step_ahead  

last_available_run_name: dataseed42_npseed0_frozen_dec01_dec10
global_mean_run_name: dataseed42_npseed0_dec01_dec10


# Supported kernel types: RBF, periodic, RationalQuadratic
# Within each dimension, kernels are summed.

# --- training ---
lr: 0.0005
num_steps: 2000
minibatch: 1024
num_mc: 7
grad_clip: 10.0
device: cpu

# --- evaluation ---
num_pred_samples: 300
num_vis_samples: 500

# --- output ---
report_root: reports
model_family: multi-kernel_lgcp
run_name: debug # lgcp_M300_steps5000_multi_kernel_COVcthwf_chrono
log_every: 100


