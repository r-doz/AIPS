# config/train_basic_lgcp_multi_kernel.yaml
years: 2024

# --- data ---
parquet_path: data/processed/cpr_gfw.parquet
gulf_csv_path: data/raw/ts_gulf_coords.csv

covariate_cols:
  - chl
  - thetao
  - fishing_block
  - is_holiday
  - is_weekend

  #- daily_mean_chl
  #- daily_chl_diff
  #- daily_mean_chl_lag_7
  #- daily_mean_chl_lag_14

  #- cell_lag_1
  #- cell_lag_7
  #- cell_roll_mean_7
  #- daily_total_lag_1
  #- daily_total_lag_7
  #- daily_total_roll_mean_7

# --- split ---
split_strategy: fixed_test_window # fixed_test_window OR chronological OR random_day
test_start_date: "2024-04-21"
test_end_date: "2024-04-30"
train_fraction: 0.9
data_seed: 42

# --- model names ---
# lagged_lgcp
# multi-kernel_lgcp 
# global_mean_poisson 
# global_cell_mean_poisson 
# last_available_poisson
model_family: last_available_poisson  

# frozen_train OR one_step_ahead  
last_available_mode: one_step_ahead  
# expanding OR frozen_train 
global_cell_mean_mode: expanding 

run_name: lgcp_multikernel_apr21_apr30 # lgcp_M300_steps5000_multi_kernel_COVcthwf_chrono / lgcp_multikernel_dec01_dec10
last_available_run_name: dataseed42_npseed0_onestep_apr21_apr30 # onestep OR frozen
global_mean_run_name: dataseed42_npseed0_nov21_nov30
global_cell_mean_run_name: dataseed42_npseed0_nov21_nov30_expanding

# --- model lgcp ---
num_steps: 5000 # 5000 is the standard
M_inducing: 300 # 300 is the standard

np_seed: 0
model:
  spatial_kernels:
    - type: RBF
      hyperparameters:
        lengthscale: 0.5 # 0.5
        variance: 1.0
      trainable:
        lengthscale: true
        variance: true
    #- type: RationalQuadratic
    #  hyperparameters:
    #    lengthscale: 1.2
    #    variance: 0.35
    #    alpha: 0.8
    #  trainable:
    #    lengthscale: true
    #    variance: true
    #    alpha: false
  temporal_kernels:
    #- type: periodic
    #  hyperparameters:
    #    lengthscale: 0.3
    #    variance: 0.55
    #    period: 3.853699
    #  trainable:
    #    lengthscale: true
    #    variance: true
    #    period: false
    - type: RBF
      hyperparameters:
        lengthscale: 0.10 # original 0.01
        variance: 0.20 # 0.20
      trainable:
        lengthscale: false
        variance: true
kernel_noise:
  value: 1.0e-3
  trainable: false

# Autoregressive setting 
lag_features:
  enabled: false 
  mode: observed_past
  target_col: ais_vessels_count
  date_col: date
  cell_cols:
    - longitude
    - latitude

  cell_lags:
    - 1
    - 7

  cell_rolling_windows:
    - 7

  daily_total_lags:
    - 1
    - 7

  daily_total_rolling_windows:
    - 7

  fillna_value: 0.0

# Supported kernel types: RBF, periodic, RationalQuadratic
# Within each dimension, kernels are summed.

# --- training ---
lr: 0.0005
minibatch: 1024
num_mc: 7
grad_clip: 10.0
device: cpu

# --- evaluation ---
num_pred_samples: 300
num_vis_samples: 500

# --- output ---
report_root: reports
log_every: 100


