# Experiment 1: spatial RBF(0.35) + RBF(0.01); fixed lengthscales.
# config/train_basic_lgcp_multi_kernel.yaml
years: [2024, 2025]

# --- data ---
parquet_path: data/processed/cpr_gfw.parquet
gulf_csv_path: data/raw/ts_gulf_coords.csv

covariate_cols:
  - chl
  - thetao
  - fishing_block
  - is_holiday
  - is_weekend

  #- daily_mean_chl
  #- daily_chl_diff
  #- daily_mean_chl_lag_7
  #- daily_mean_chl_lag_14

  - cell_lag_1 # best: use it
  - cell_lag_7 # best: use it
  #- cell_roll_mean_7
  #- daily_total_lag_1
  #- daily_total_lag_7
  #- daily_total_roll_mean_7

# --- split ---
split_strategy: fixed_test_window
#split_strategy: chronological
#split_strategy: random_day
test_start_date: "2025-05-05"
test_end_date: "2025-05-11"
train_fraction: 0.9
data_seed: 42

# --- model output names ---
model_family: new_tests
#model_family: multi_kernel_lgcp
#model_family: multi_kernel_lgcp_lagged
#model_family: basic_lgcp
#model_family: global_mean_poisson
#model_family: global_cell_mean_poisson
#model_family: last_available_onestep
#model_family: last_available_frozen

# --- model selection ---
last_available_mode: one_step_ahead
#last_available_mode: frozen_train

global_cell_mean_mode: expanding
#global_cell_mean_mode: frozen_train

run_name: may_5_11_lgcp_2_spatial_kernels_classifier_hard_period_14_days
last_available_run_name: dataseed42_npseed0_onestep
#last_available_run_name: dataseed42_npseed0_frozen
global_mean_run_name: dataseed42_npseed0
global_cell_mean_run_name: dataseed42_npseed0

# --- model lgcp ---
num_steps: 5000 # 5000 is the standard
M_inducing: 300 # 300 is the standard

np_seed: 0
model:
  spatial_composition: sum
  temporal_composition: sum

  spatial_kernels:
  - type: RBF
    hyperparameters:
      lengthscale: 0.2
      variance: 2.0
    trainable:
      lengthscale: false
      variance: true
  - type: RBF
    hyperparameters:
      lengthscale: 0.01
      variance: 0.5
    trainable:
      lengthscale: false
      variance: true

  temporal_kernels:
  - type: RBF
    hyperparameters:
        lengthscale: 0.01 # 0.01 best
        variance: 0.5 #
    trainable:
        lengthscale: false # false best
        variance: true
  - type: periodic
    hyperparameters:
        lengthscale: 0.8
        variance: 0.2
        period_days: 14 # calendar days; converted using the training time scaler
    trainable:
        lengthscale: false
        variance: true
        period: false
  #- type: periodic
  #  hyperparameters:
  #      lengthscale: 0.50
  #      variance: 0.2
  #      period: 1
  #  trainable:
  #      lengthscale: true
  #      variance: true
  #      period: true
  #- type: quasi_periodic
  #  hyperparameters:
  #      envelope_lengthscale: 0.30
  #      periodic_lengthscale: 0.10
  #      period: 0.074
  #      variance: 0.20
  #  trainable:
  #      envelope_lengthscale: true
  #      periodic_lengthscale: true
  #      period: true
  #      variance: true

kernel_noise:
  value: 1.0e-3
  trainable: false

# Autoregressive setting
lag_features:
  enabled: true
  mode: observed_past
  target_col: ais_vessels_count
  date_col: date
  cell_cols:
    - longitude
    - latitude

  cell_lags:
    - 1
    - 7

  cell_rolling_windows:
    - 7

  daily_total_lags:
    - 1
    - 7

  daily_total_rolling_windows:
    - 7

  fillna_value: 0.0

# Zero-inflation gate: a small MLP classifier (y > 0) trained on the same
# standardized features as the LGCP. When enabled, test predictions the
# classifier calls "zero" are forced to 0, correcting the LGCP's tendency
# to smooth a small positive rate into always-zero cells/dates.
zero_gate:
  enabled: true 
  mode: hard # hard or soft or hard_redistribute
  hidden_layer_sizes: [32]
  activation: relu
  alpha: 1.0e-4
  max_iter: 500
  threshold: 0.3

# Supported kernel types: RBF, periodic, RationalQuadratic
# Within each dimension, kernels are summed.

# --- training ---
lr: 0.001
minibatch: 1024
num_mc: 32
grad_clip: 10.0
device: cpu

# --- evaluation ---
num_pred_samples: 300
num_vis_samples: 500

# --- output ---
report_root: reports/experiments/final_experiments
log_every: 100
