# Gulf of Trieste, 2022-2025, for the rebuttal (longer training history), built by
# scripts/rebuttal/build_region_data.py with the paper's pipeline, area and marine boundary.
# All four years use the Copernicus reanalysis covariates and the current Global Fishing Watch data, so the
# years are consistent with each other (the analysis-forecast products of the paper's data now start in
# Aug./Sep. 2024, so 2022-2023 cannot be built from them).
name: trieste_reanalysis
data_root: data/rebuttal/trieste_reanalysis
area: {minimum_longitude: 13.141159647873394, maximum_longitude: 13.8238, minimum_latitude: 45.4698, maximum_latitude: 45.8078}
# GFW has paused per-vessel reports (Nov. 2026): per-flag records, same counts (see build_region_data.py)
ais_group_by: FLAG
marine_bounds: data/raw/italy_marine_bounds.csv
products:
  phy: cmems_mod_med_phy-temp_my_4.2km_P1D-m
  bgc: cmems_mod_med_bgc-plankton_my_4.2km_P1D-m
  sal: cmems_mod_med_phy-sal_my_4.2km_P1D-m
fishing_block:   # the paper's rule (31 July - 13 September)
  2022: [["2022-07-31", "2022-09-13"]]
  2023: [["2023-07-31", "2023-09-13"]]
  2024: [["2024-07-31", "2024-09-13"]]
  2025: [["2025-07-31", "2025-09-13"]]
