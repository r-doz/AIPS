# Venice-Chioggia (northern Adriatic) dataset for the rebuttal, built by scripts/rebuttal/build_region_data.py
# with the paper's pipeline. Same sources and rules as the Gulf of Trieste data, except:
#   - covariates from the Copernicus reanalysis (the analysis-forecast products used for the paper's Trieste data
#     now start in Aug./Sep. 2024);
#   - no marine boundary line (the area is in Italian waters); AIS keeps Italian-flagged vessels, as in the paper.
name: venice
data_root: data/rebuttal/venice
area: {minimum_longitude: 12.30, maximum_longitude: 12.90, minimum_latitude: 45.05, maximum_latitude: 45.40}
# GFW has paused per-vessel reports (Nov. 2026): per-flag records, same counts (see build_region_data.py)
ais_group_by: FLAG
marine_bounds: none
products:
  phy: cmems_mod_med_phy-temp_my_4.2km_P1D-m
  bgc: cmems_mod_med_bgc-plankton_my_4.2km_P1D-m
  sal: cmems_mod_med_phy-sal_my_4.2km_P1D-m
# trawling ban: the paper's rule (31 July - 13 September); the Venice area is in the same Trieste-Ancona
# zone as the Gulf of Trieste
fishing_block:
  2024: [["2024-07-31", "2024-09-13"]]
  2025: [["2025-07-31", "2025-09-13"]]
