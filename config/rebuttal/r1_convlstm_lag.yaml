# Reviewer 1, experiment 3: ConvLSTM with the lags of Red-LGCP (scripts/rebuttal/r1_neural_hurdle.py).
# Copy of config/18_convlstm_salinity.yaml plus cell_lag_1 and cell_lag_7, built by the same lag_features
# block as Red-LGCP and the GNN, so every frame (including the target day's) carries the counts of t-1 and t-7.
# Used with a Poisson head and with a hurdle head; seq_length and lr are re-selected on the validation weeks.
years:
- 2024
- 2025
parquet_path: data/processed/cpr_gfw_salinity.parquet
gulf_csv_path: data/raw/ts_gulf_coords.csv
target_col: ais_vessels_count
split_strategy: fixed_test_window
train_fraction: 0.9
data_seed: 42
test_start_date: '2025-05-05'
test_end_date: '2025-05-11'
covariate_cols:
- chl
- thetao
- fishing_block
- is_holiday
- is_weekend
- salinity
- cell_lag_1
- cell_lag_7
standardize_features: true
seq_length: 3
hidden_channels: 4
num_layers: 2
kernel_size: 3
dropout: 0.2
lr: 0.01
num_epochs: 300
torch_seed: 0
device: cpu
log_every: 25
report_root: reports/rebuttal/reviewer1
model_family: new_tests
run_name: may_5_11_convlstm
generate_spatial_plots: true
lag_features:
  enabled: true
  mode: observed_past
  target_col: ais_vessels_count
  date_col: date
  cell_cols:
  - longitude
  - latitude
  cell_lags:
  - 1
  - 7
  cell_rolling_windows:
  - 7
  daily_total_lags:
  - 1
  - 7
  daily_total_rolling_windows:
  - 7
  fillna_value: 0.0
