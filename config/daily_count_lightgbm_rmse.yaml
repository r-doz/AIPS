# Squared-error training on daily totals (RMSE objective).
years:
- 2024
- 2025
parquet_path: data/processed/cpr_gfw.parquet
target_col: ais_vessels_count
split_strategy: fixed_test_window
test_start_date: '2025-05-03'
test_end_date: '2025-05-09'
train_fraction: 0.9
data_seed: 42
forecast_mode: one_step_ahead
covariate_cols:
- chl
- thetao
- fishing_block
- is_holiday
- is_weekend
- cell_lag_1
- cell_lag_7
include_coords: true
include_time: true
lag_features:
  enabled: true
  mode: observed_past
  cell_lags:
  - 1
  - 7
  cell_rolling_windows:
  - 7
  daily_total_lags:
  - 1
  - 7
  daily_total_rolling_windows:
  - 7
  fillna_value: 0.0
model:
  objective: regression
  n_estimators: 300
  learning_rate: 0.03
  num_leaves: 31
  max_depth: 5
  min_child_samples: 40
  reg_lambda: 5.0
  random_state: 0
  n_jobs: 1
  verbosity: -1
  deterministic: true
  force_col_wise: true
  subsample_freq: 0
  subsample: 1.0
  reg_alpha: 0.1
  min_split_gain: 0.01
  max_bin: 31
  colsample_bytree: 1.0
report_root: reports/experiments
model_family: daily_count
run_name: may_5_11_lightgbm_tuned_rmse
training:
  half_life_days: null
