years:
- 2024
- 2025
parquet_path: data/processed/cpr_gfw_salinity.parquet
target_col: ais_vessels_count
split_strategy: fixed_test_window
train_fraction: 0.9
data_seed: 42
test_start_date: '2025-05-05'
test_end_date: '2025-05-11'
window_size: 14
drop_incomplete_windows: true
covariate_cols:
- chl
- thetao
- is_holiday
- is_weekend
- fishing_block
- cell_lag_1
- cell_lag_7
- salinity
include_coords: true
include_time: true
poisson_alpha: 0.01
max_iter: 1000
standardize_features: true
report_root: reports/experiments/salinity_experiment
model_family: with_salinity
run_name: may_5_11_14_window_poisson_glm
