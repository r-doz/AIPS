# Config for scripts/13_evaluate_last_available_poisson.py.
parquet_path: data/processed/cpr_gfw.parquet
years: [2024, 2025]

# Same evaluation window as exp1.yaml.
split_strategy: fixed_test_window
test_start_date: "2025-05-05"
test_end_date: "2025-05-11"

# Use the latest observed count available before each prediction date.
last_available_mode: one_step_ahead # Alternative: frozen_train

report_root: reports/experiments/final_experiments
model_family: new_tests
run_name: may_5_11_last_available_one_step_ahead
