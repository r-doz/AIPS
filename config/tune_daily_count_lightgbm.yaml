# Uses the exact covariates and data settings from this configuration.
base_config: config/daily_count_lightgbm.yaml
n_trials: 60 # Includes original parameters as trial 0; 60 x 8 = 480 fits.
seed: 42
report_root: reports/daily_tuning/daily_count_lightgbm

# Four non-overlapping seven-day windows in each month, using 2025.
# Each fit uses only dates before its window; observations update lags daily.
windows:
  - {name: may_1_7, start: '2025-05-01', end: '2025-05-07'}
  - {name: may_8_14, start: '2025-05-08', end: '2025-05-14'}
  - {name: may_15_21, start: '2025-05-15', end: '2025-05-21'}
  - {name: may_22_28, start: '2025-05-22', end: '2025-05-28'}
  - {name: nov_1_7, start: '2025-11-01', end: '2025-11-07'}
  - {name: nov_8_14, start: '2025-11-08', end: '2025-11-14'}
  - {name: nov_15_21, start: '2025-11-15', end: '2025-11-21'}
  - {name: nov_22_28, start: '2025-11-22', end: '2025-11-28'}

# Random search over the main accuracy/regularization parameters.
# Objective, reproducibility settings, and thread count remain fixed.
search_space:
  n_estimators: [150, 300, 600, 1000]
  learning_rate: [0.01, 0.03, 0.05]
  num_leaves: [3, 7, 15, 31]
  max_depth: [2, 3, 4, 5]
  min_child_samples: [10, 20, 40, 60]
  reg_lambda: [0.0, 0.1, 1.0, 5.0, 10.0]
  reg_alpha: [0.0, 0.1, 1.0]
  colsample_bytree: [0.7, 0.9, 1.0]
  subsample: [0.8, 1.0]
  subsample_freq: [1] # Reset to 0 when subsample=1.
  min_split_gain: [0.0, 0.01, 0.1]
  max_bin: [31, 63, 127, 255]

  half_life_days: [null, 90, 180, 365]
