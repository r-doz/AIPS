# config/sweep_lgcp_hparams.yaml
#
# Hyperparameter sweep over (lr, num_mc) for the LGCP model.
# Run with: python scripts/16_sweep_lgcp_hparams.py --config config/sweep_lgcp_hparams.yaml

# All data/model/kernel settings are inherited from this config; only lr and
# num_mc are overridden per combo during the sweep.
base_config: config/train_basic_lgcp_multi_kernel.yaml

sweep:
  lr_grid: [0.0001, 0.0003, 0.001, 0.003, 0.01, 0.03, 0.1, 0.3]
  num_mc_grid: [8, 16, 32, 64, 128, 256]

  # Metric to rank combos by (see src/models/metrics_lgcp.py):
  #   mean_ll_obs, mean_ll_daily (higher is better)
  #   mae_obs, rmse_obs, mae_daily, rmse_daily (lower is better)
  metric: mean_ll_obs

  # Cheap search phase: every combo trained for this many steps and scored
  # on a validation window (see val_days below).
  num_steps_search: 1500

  # Confirm phase: only the top-K search combos are retrained at full length
  # (defaults to base_config's num_steps) and evaluated on the real test window.
  top_k_confirm: 2
  # num_steps_confirm: 5000   # uncomment to override base_config's num_steps

  # Validation window used for the search phase: the val_days days
  # immediately before base_config's test_start_date. Never overlaps the
  # real test window, so the final confirm-phase test metrics stay honest.
  val_days: 10
  # val_start_date: "2025-04-11"   # uncomment to override explicitly
  # val_end_date: "2025-04-20"

  sweep_seed: 0
